name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run unit & integration tests
      run: |
        node --test test/*.test.js

    - name: Security audit
      run: |
        npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret and credential scan
      run: |
        echo "Verifying no hardcoded credentials exist in repository..."
        if grep -rn "botToken: \"[0-9]\{8,10\}:[A-Za-z0-9_-]\{35\}\"" --exclude-dir=node_modules .; then
          echo "Error: Hardcoded Telegram Bot Token detected!"
          exit 1
        fi
        echo "No secret leaks detected."
